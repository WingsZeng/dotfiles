OPENAI_HOST: https://api.openai.com
OPENAI_BASE_PATH: v1/chat/completions
GOOSE_PROVIDER: custom_wings
GOOSE_MODEL: gpt-5.3-codex
slash_commands:
- command: rpi-research
  recipe_path: /home/wings/.config/goose/recipes/rpi-research.yaml
- command: rpi-plan
  recipe_path: /home/wings/.config/goose/recipes/rpi-plan.yaml
- command: rpi-impl
  recipe_path: /home/wings/.config/goose/recipes/rpi-implement.yaml
- command: rpi-iterate
  recipe_path: /home/wings/.config/goose/recipes/rpi-iterate.yaml
extensions:
  computercontroller:
    enabled: false
    type: builtin
    name: computercontroller
    description: controls for webscraping, file caching, and automations
    display_name: Computer Controller
    timeout: 300
    bundled: true
    available_tools: []
  extensionmanager:
    enabled: true
    type: platform
    name: Extension Manager
    description: Enable extension management tools for discovering, enabling, and disabling extensions
    display_name: Extension Manager
    bundled: true
    available_tools: []
  todo:
    enabled: true
    type: platform
    name: todo
    description: Enable a todo list for goose so it can keep track of what it is doing
    display_name: Todo
    bundled: true
    available_tools: []
  chatrecall:
    enabled: false
    type: platform
    name: chatrecall
    description: Search past conversations and load session summaries for contextual memory
    display_name: Chat Recall
    bundled: true
    available_tools: []
  code_execution:
    enabled: false
    type: platform
    name: code_execution
    description: Goose will make extension calls through code execution, saving tokens
    display_name: Code Mode
    bundled: true
    available_tools: []
  developer:
    enabled: true
    type: builtin
    name: developer
    description: Code editing and shell access
    display_name: Developer Tools
    timeout: 300
    bundled: true
    available_tools:
    - shell
    - text_editor
  memory:
    enabled: false
    type: builtin
    name: memory
    description: Tools to save and retrieve durable memories
    display_name: Memory
    timeout: 300
    bundled: true
    available_tools: []
  pdfreader:
    enabled: false
    type: stdio
    name: PDF Reader
    description: Read large and complex PDF documents
    cmd: npx
    args:
    - '@sylphx/pdf-reader-mcp'
    envs: {}
    env_keys: []
    timeout: 300
    bundled: null
    available_tools: []
  fetch:
    enabled: false
    type: stdio
    name: Fetch
    description: Web content fetching and processing capabilities
    cmd: uvx
    args:
    - --from
    - git+https://github.com/WingsZeng/jina-idle-fetch-mcp.git
    - jina-idle-fetch-mcp
    envs: {}
    env_keys: []
    timeout: 300
    bundled: null
    available_tools: []
  idapro:
    enabled: false
    type: stdio
    name: IDA Pro
    description: Session-based Headless IDA Pro
    cmd: /home/wings/.idapro/.venv/bin/idalib-session-mcp
    args: []
    envs: {}
    env_keys: []
    timeout: 300
    bundled: null
    available_tools: []
  pwndbg:
    enabled: false
    type: stdio
    name: pwndbg
    description: An MCP tool specifically engineered to provide AI agents with robust ELF debugging capabilities
    cmd: uv
    args:
    - --directory
    - /home/wings/Workspace/Projects/pwndbg-mcp
    - run
    - pwndbg-mcp
    - --transport
    - stdio
    - --pwndbg
    - pwndbg
    envs: {}
    env_keys: []
    timeout: 300
    bundled: null
    available_tools: []
  goosedocs:
    enabled: false
    type: stdio
    name: goose Docs
    description: GitMCP for goose documentation
    cmd: npx
    args:
    - mcp-remote
    - https://block.gitmcp.io/goose/
    envs: {}
    env_keys: []
    timeout: 300
    bundled: null
    available_tools: []
  deepwiki:
    enabled: false
    type: streamable_http
    name: DeepWiki
    description: AI documentation for any GitHub repository
    uri: https://mcp.deepwiki.com/mcp
    envs: {}
    env_keys: []
    headers: {}
    timeout: 300
    bundled: null
    available_tools: []
  paper:
    enabled: false
    type: stdio
    name: Paper
    description: Intelligent academic paper retrieval
    cmd: npx
    args:
    - -y
    - github:guangxiangdebizi/Paper-MCP
    envs: {}
    env_keys:
    - OPENALEX_EMAIL
    timeout: 300
    bundled: null
    available_tools: []
  knowledgegraphmemory:
    enabled: false
    type: stdio
    name: Knowledge Graph Memory
    description: Graph-based memory system for persistent knowledge storage
    cmd: npx
    args:
    - -y
    - '@modelcontextprotocol/server-memory'
    envs: {}
    env_keys: []
    timeout: 300
    bundled: null
    available_tools: []
  drawio:
    enabled: false
    type: stdio
    name: drawio
    description: Use Next AI Draw.io with AI agents
    cmd: npx
    args:
    - -y
    - '@next-ai-drawio/mcp-server@latest'
    envs: {}
    env_keys: []
    timeout: 300
    bundled: null
    available_tools: []
  zellij:
    enabled: false
    type: stdio
    name: Zellij
    description: An MCP for managing Zellij terminal workspace sessions
    cmd: npx
    args:
    - -y
    - github:GitJuhb/zellij-mcp-server
    envs: {}
    env_keys: []
    timeout: 300
    bundled: null
    available_tools: []
  websearch:
    enabled: false
    type: stdio
    name: Web Search
    description: Search the web with MCP
    cmd: uvx
    args:
    - --from
    - git+https://github.com/WingsZeng/duckduckgo-mcp-server.git
    - duckduckgo-mcp-server
    envs: {}
    env_keys: []
    timeout: 300
    bundled: null
    available_tools: []
  scihub:
    enabled: false
    type: stdio
    name: Sci Hub
    description: Download academic papers from Sci-Hub via DOI
    cmd: npx
    args:
    - sci-mcp-server
    envs: {}
    env_keys: []
    timeout: 300
    bundled: null
    available_tools: []
  apps:
    enabled: false
    type: platform
    name: apps
    description: Create and manage custom Goose apps through chat. Apps are HTML/CSS/JavaScript and run in sandboxed windows.
    display_name: Apps
    bundled: true
    available_tools: []
  tom:
    enabled: true
    type: platform
    name: tom
    description: Inject custom context into every turn via GOOSE_MOIM_MESSAGE_TEXT and GOOSE_MOIM_MESSAGE_FILE environment variables
    display_name: Top Of Mind
    bundled: true
    available_tools: []
  summon:
    enabled: false
    type: platform
    name: summon
    description: Load knowledge and delegate tasks to subagents
    display_name: Summon
    bundled: true
    available_tools: []
GOOSE_TELEMETRY_ENABLED: false
